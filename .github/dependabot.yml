version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Jellyfin.* must track the server ABI declared as `targetAbi` in
      # build.yaml; bump them deliberately together with it.
      - dependency-name: "Jellyfin.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
