name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3). Leave empty to auto-detect from commits.'
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  JPRM_VERSION: 1.1.0

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      changelog: ${{ steps.notes.outputs.changelog }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find previous tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || echo "")
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      # Best effort: without it (no API key, LLM outage) the release still
      # ships with the plain commit log.
      - name: Generate AI changelog
        id: changelog
        continue-on-error: true
        uses: lmgarret/llm-release-action@89ad4c3af8aa41030849a703ab6b081d0d384186 # v1.2.0
        with:
          model: anthropic/claude-sonnet-5-5
          model_analysis: anthropic/claude-haiku-5-5
          # First release has no tag to bump from: v0.0.0 makes the action
          # walk the full history instead of failing.
          current_version: ${{ steps.prev_tag.outputs.tag || 'v0.0.0' }}
          # Admins install and configure it: breaking means they must act on upgrade.
          project_type: service
          changelog_config: |
            default:
              languages: [en]
              tone: professional
              sections: [breaking, features, improvements, fixes]
              benefit_focused: true
              include_infrastructure: false
              summary_only: false
              emojis: true
            # Shown in the Jellyfin plugin catalog: short plain text.
            catalog:
              languages: [en]
              tone: professional
              sections: [breaking, features, improvements, fixes]
              benefit_focused: true
              include_infrastructure: false
              emojis: false
              output_format: plain
              validation:
                max_length: 1000
          context_files: README.md
          max_commits: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Jellyfin versions are four numeric parts, so only plain X.Y.Z
      # releases are accepted; the rolling `edge` build covers prereleases.
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ steps.changelog.outputs.next_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RAW="${INPUT_VERSION:-$NEXT_VERSION}"
            VERSION="${RAW#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '${VERSION}' is not X.Y.Z"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        id: notes
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.changelogs && fromJSON(steps.changelog.outputs.changelogs).default.en || '' }}
          CATALOG_CHANGELOG: ${{ steps.changelog.outputs.changelogs && fromJSON(steps.changelog.outputs.changelogs).catalog.en || '' }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD")
          else
            COMMITS=$(git log --oneline)
          fi
          # Shown in the Jellyfin plugin catalog.
          PLUGIN_CHANGELOG="${CATALOG_CHANGELOG:-${CHANGELOG:-$COMMITS}}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          PAGES="https://${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$PLUGIN_CHANGELOG"
            echo "CHANGELOG_EOF"
            echo "body<<BODY_EOF"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
              echo "---"
              echo ""
            fi
            echo "### Install"
            echo ""
            echo "In Jellyfin, go to **Dashboard → Plugins → Repositories**, add the repository below, then install **MQTT** from the catalog:"
            echo ""
            echo '```'
            echo "${PAGES}/manifest.json            # stable releases"
            echo "${PAGES}/manifest-unstable.json   # stable + rolling edge builds"
            echo '```'
            echo ""
            echo "<details><summary>Full commit log</summary>"
            echo ""
            echo '```'
            echo "$COMMITS"
            echo '```'
            echo "</details>"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build plugin
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install "jprm==${JPRM_VERSION}"
      - name: dotnet test
        run: dotnet test Jellyfin.Plugin.Mqtt.slnx --configuration Release
      - name: Set changelog
        env:
          CHANGELOG: ${{ needs.resolve-version.outputs.changelog }}
        run: yq -i '.changelog = strenv(CHANGELOG)' build.yaml
      - name: jprm plugin build
        run: |
          mkdir -p artifacts
          jprm --verbosity=debug plugin build . --output artifacts --version "${{ needs.resolve-version.outputs.name }}.0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: artifacts/*.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [resolve-version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
      - name: Create versioned release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.resolve-version.outputs.body }}
          files: '*.zip'
          make_latest: true
          generate_release_notes: false
      # Dispatched rather than called so it runs on master, which the
      # github-pages environment allows by default (tag refs are not).
      - name: Refresh plugin repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref master
